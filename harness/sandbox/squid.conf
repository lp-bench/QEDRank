# Forward proxy for the web-search configuration: every request from the sandbox is logged.
http_port 3128
acl sandbox src 0.0.0.0/0
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow sandbox
http_access deny all
# time, client, method, address (host:port for CONNECT), status, bytes
logformat proofbench %ts.%03tu %>a %rm %ru %>Hs %<st
access_log /var/log/squid/access.log proofbench
cache deny all
