# QEDRank Lean sandbox project.
#
# Pinned toolchain: see ./lean-toolchain. Pinned Mathlib: the `rev` below, with
# the resolved commit recorded in lake-manifest.json after `lake update`.
#
# Only two modules live here on purpose:
#   QEDRank.Prelude  - definitions-only prelude that models may import
#   QEDRank.Audit    - evaluator-only meta commands (models must not import it)
# Per-paper generated preludes are written to QEDRank/Papers/ by the runner and
# are git-ignored. Model outputs and reference files are compiled in scratch
# roots outside this tree (see qedrank/lib/lean.js).
name = "qedrank"
defaultTargets = ["QEDRank"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "QEDRank"
