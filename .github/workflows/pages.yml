# Publishes QEDRank_java/ (a redirect to the QEDRank web interface, https://qedrank.vercel.app)
# with GitHub Pages at https://proof-bench.github.io/QEDRank/.
# One-time setup on GitHub: Settings -> Pages -> Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
    paths: [QEDRank_java/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: QEDRank_java
      - id: deployment
        uses: actions/deploy-pages@v4
