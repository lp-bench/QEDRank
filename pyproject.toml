[project]
name = "proofbench-eval"
version = "0.1.0"
description = "Inspect AI harness for ProofBench: uniform agentic evaluation with Lean-only grading"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai==0.3.276",
    "anthropic>=0.60",
    "openai>=1.90",
]

[project.optional-dependencies]
search = []           # web search uses the Tavily or Exa HTTP API through Inspect; set TAVILY_API_KEY or EXA_API_KEY

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["proofbench_eval*"]
