# As compose.yaml, with the agent's container offline too.
services:
  default:
    image: proofbench-sandbox:latest
    init: true
    command: tail -f /dev/null
    working_dir: /opt/proofbench
    network_mode: none
    cpus: 2.0
    mem_limit: 8gb
  verifier:
    image: proofbench-sandbox:latest
    init: true
    command: tail -f /dev/null
    working_dir: /opt/proofbench
    network_mode: none
    cpus: 2.0
    mem_limit: 8gb
