# Web-search configuration. The sandbox has no route to the internet except through the
# proxy service, which logs every request (full address for http, host and port for https).
# The harness reads that log at the end of each sample, next to the queries and addresses the
# tools themselves record. Web search itself runs in the harness process through one external
# provider for every model.
services:
  default:
    image: ${PROOFBENCH_IMAGE:-proofbench-sandbox:latest}
    init: true
    command: ["sleep", "infinity"]
    working_dir: /workspace/ProofBench
    cpus: ${PROOFBENCH_CPUS:-4}
    mem_limit: ${PROOFBENCH_MEMORY:-16g}
    environment:
      LEAN_PROJECT_PATH: /workspace/ProofBench
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      http_proxy: http://proxy:3128
      https_proxy: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
    networks: [sandbox]
    depends_on: [proxy]
  proxy:
    image: ubuntu/squid:latest
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks: [sandbox, egress]
networks:
  sandbox:
    internal: true
  egress: {}
