# List prices in USD per million tokens, for Inspect's cost tracking (run.sh passes this file
# as --model-cost-config; scripts/analyze.py sums the cost into results.csv).
# input_cache_write is the 5-minute rate; Inspect bills 1-hour cache writes itself.
# Only models in Inspect's model database may appear here (Inspect stops otherwise). Models
# without an entry, e.g. the free GWDG models, get no cost.
# Source: https://platform.claude.com/docs/en/about-claude/pricing (checked 2026-10-26);
# no long-context surcharge for these models.
anthropic/claude-opus-5-5:
  input: 4.00
  output: 20.00
  input_cache_write: 5.00
  input_cache_read: 0.20
anthropic/claude-fable-5-1:
  input: 10.00
  output: 50.00
  input_cache_write: 12.50
  input_cache_read: 0.25
