[project]
name = "inspect-apptainer"
version = "0.0.1"
description = "Apptainer sandbox environment for Inspect AI (HPC clusters without Docker)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["inspect-ai>=0.3.276"]

[project.entry-points.inspect_ai]
inspect_apptainer = "inspect_apptainer._registry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
