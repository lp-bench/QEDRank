# Offline configuration: no network of any kind. The shell cannot download papers or
# packages, and the Lean search tools that call a web service are not offered.
services:
  default:
    image: ${PROOFBENCH_IMAGE:-proofbench-sandbox:latest}
    init: true
    command: ["sleep", "infinity"]
    network_mode: none
    working_dir: /workspace/ProofBench
    cpus: ${PROOFBENCH_CPUS:-4}
    mem_limit: ${PROOFBENCH_MEMORY:-16g}
    environment:
      LEAN_PROJECT_PATH: /workspace/ProofBench
