# Unit tests, the production build and the Selenium end-to-end suite over every fixture dataset.
# The same file works at the root of branch QEDRank (the app is the root) and at the root of
# main (the app is QEDRank_java/): the first step finds the app folder. No key, no private
# data and no network beyond npm and the browser driver are needed.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: loc
        run: echo "dir=$([ -d QEDRank_java ] && echo QEDRank_java || echo .)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.loc.outputs.dir }}/package-lock.json
      - run: npm ci
        working-directory: ${{ steps.loc.outputs.dir }}
      - run: npm test
        working-directory: ${{ steps.loc.outputs.dir }}
      - run: npx vite build
        working-directory: ${{ steps.loc.outputs.dir }}

  e2e:
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per fixture dataset: the run the Evaluation page is checked with.
        dataset: [e2e-prove, e2e-formalize]
    steps:
      - uses: actions/checkout@v4
      - id: loc
        run: echo "dir=$([ -d QEDRank_java ] && echo QEDRank_java || echo .)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.loc.outputs.dir }}/package-lock.json
      - run: npm ci
        working-directory: ${{ steps.loc.outputs.dir }}
      - name: End-to-end (headless Chrome, Selenium Manager fetches the driver)
        run: npm run e2e
        working-directory: ${{ steps.loc.outputs.dir }}
        env:
          E2E_RUN_IDS: ${{ matrix.dataset }}
          E2E_BROWSER: chrome
